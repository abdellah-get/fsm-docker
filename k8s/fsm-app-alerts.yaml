apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fsm-app-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: fsm-app.rules
      rules:
        - alert: FsmAppHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(fsm_http_request_duration_seconds_bucket[5m])) by (le)
            ) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Latence p95 de fsm-app au-dessus du SLO"
            description: "Le p95 dépasse 1s depuis plus de 2 minutes (SLO non respecté)."
