apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fsm-app-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: fsm-app
  namespaceSelector:
    matchNames:
      - jalon9
  endpoints:
    - port: http
      path: /api/metrics
      interval: 15s
