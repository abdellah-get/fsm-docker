apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fsm-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/abdellah-get/fsm-docker.git"
    path: "fsm-app"
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: jalon9
  # Empêche Argo de réécraser les vraies clés injectées hors Git
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: fsm-secrets
      jsonPointers:
        - /data
        - /stringData
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
